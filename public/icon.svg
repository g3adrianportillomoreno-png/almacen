<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo de la App con Esquinas Redondeadas (Estilo Icono Móvil) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Tarjeta interior blanca -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="#ffffff" filter="url(#shadow)" />

  <!-- Texto CDM -->
  <text x="256" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="2">CDM</text>

  <!-- Barra de Almacén / Icono de Caja / Código de Barras -->
  <g transform="translate(146, 270)">
    <!-- Código de barras estilizado -->
    <rect x="0" y="0" width="8" height="42" rx="3" fill="#1e293b" />
    <rect x="14" y="0" width="16" height="42" rx="3" fill="#1e293b" />
    <rect x="36" y="0" width="6" height="42" rx="3" fill="#1e293b" />
    <rect x="48" y="0" width="22" height="42" rx="3" fill="#1e293b" />
    <rect x="76" y="0" width="10" height="42" rx="3" fill="#1e293b" />
    <rect x="92" y="0" width="18" height="42" rx="3" fill="#1e293b" />
    <rect x="116" y="0" width="8" height="42" rx="3" fill="#1e293b" />
    <rect x="130" y="0" width="24" height="42" rx="3" fill="#1e293b" />
    <rect x="160" y="0" width="12" height="42" rx="3" fill="#1e293b" />
    <rect x="178" y="0" width="18" height="42" rx="3" fill="#1e293b" />
    <rect x="202" y="0" width="8" height="42" rx="3" fill="#1e293b" />
    <rect x="216" y="0" width="4" height="42" rx="2" fill="#1e293b" />
  </g>

  <!-- Subtítulo ALMACÉN -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="6">ALMACÉN</text>
</svg>